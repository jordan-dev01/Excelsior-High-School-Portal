<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/ExcelsiorHighSchool_Kingston_Stylesheet.css" />
    <script src="../js/ExcelsiorHighSchool_Kingston_Storage.js"></script>
  </head>
  <body>
    <img
      src="../images/ExcelsiorHighSchool_Kingston_Logo.png"
      alt="Excelsior High School Logo"
      class="logo"
    />
       <nav class="navbar">
        <ul>
          <li><a href="ExcelsiorHighSchool_Kingston_Home.html">Home</a></li>
        </ul>
    <form id="loginForm" class="Login">
      <label for="usernameInput">Username:</label>
      <input
        type="text"
        id="usernameInput"
        name="username"
        required
      /><br /><br />

      <label for="passwordInput">Password:</label>
      <input
        type="password"
        id="passwordInput"
        name="password"
        required
      /><br /><br />

      <input class="login_button" type="submit" value="Login" />

      <p id="loginError" style="color: red; display: none"></p>
    </form>
    <script>
      seedDatabase();

      document
        .getElementById('loginForm')
        .addEventListener('submit', function (event) {
          event.preventDefault();

          const username = document
            .getElementById('usernameInput')
            .value.trim();
          const password = document.getElementById('passwordInput').value;

          const result = login(username, password);

          if (!result.success) {
            document.getElementById('loginError').textContent = result.message;
            document.getElementById('loginError').style.display = 'block';
            return;
          }

          if (result.user.role === 'admin') {
            window.location.href = 'ExcelsiorHighSchool_Kingston_Admin.html';
          } else if (result.user.role === 'teacher') {
            window.location.href = 'ExcelsiorHighSchool_Kingston_TeacherPanel.html';
          } else {
            document.getElementById('loginError').textContent =
              'No page has been set up for this role yet.';
            document.getElementById('loginError').style.display = 'block';
          }
        });
    </script>
  </body>
</html>
