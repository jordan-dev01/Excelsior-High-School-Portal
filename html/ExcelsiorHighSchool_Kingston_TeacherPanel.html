<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Panel — Excelsior High School</title>
    <link rel="stylesheet" href="Stylesheet.css" />
    <script src="storage.js" defer></script>
  </head>
  <body>
    <script>
      requireRole('teacher');
    </script>

    <header class="site-header">
      <img
        src="images/Excelsior Logo.png"
        alt="Excelsior High School Logo"
        class="logo"
      />
      <h1>Teacher Panel</h1>
      <button id="logoutBtn" class="login_button">Logout</button>
    </header>

    <main>
      <section>
        <h2>Curriculum Filter</h2>
        <label for="subjectSelect">Select a Subject</label>
        <select id="subjectSelect">
          <option value="">-- Select Subject --</option>
        </select>
      </section>

      <section>
        <h2>Grade Entry</h2>
        <p id="gradePlaceholder">Choose a subject to load the student list.</p>
        <table class="directory-table">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Student Name</th>
              <th>Grade</th>
              <th>Save</th>
            </tr>
          </thead>
          <tbody id="gradeTable"></tbody>
        </table>
      </section>

      <section>
        <h2>Report Card Generator</h2>
        <label for="reportStudent">Select Student</label>
        <select id="reportStudent">
          <option value="">-- Select Student --</option>
        </select>
        <div id="reportCard"></div>
      </section>
    </main>

    <script>
      document.getElementById('logoutBtn').addEventListener('click', logout);

      // Populate subject dropdown from storage
      const subjectSelect = document.getElementById('subjectSelect');
      getData('subjects').forEach(function (s) {
        const opt = document.createElement('option');
        opt.value = s.code || s.name;
        opt.textContent = s.name;
        subjectSelect.appendChild(opt);
      });
    </script>
  </body>
</html>
